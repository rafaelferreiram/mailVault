<svg viewBox="0 0 520 100" xmlns="http://www.w3.org/2000/svg" width="520" height="100">
  <!-- Icon mark -->
  <rect x="0"  y="8"  width="88" height="12" rx="0" fill="#1a1a1a"/>
  <rect x="12" y="30" width="76" height="12" rx="0" fill="#1a1a1a"/>
  <rect x="24" y="52" width="64" height="12" rx="0" fill="#1a1a1a"/>
  <rect x="36" y="74" width="52" height="12" rx="0" fill="#1a1a1a"/>
  <rect x="104" y="0" width="10" height="100" rx="0" fill="#1a1a1a"/>

  <!-- Wordmark: "mail" light + "vault" bold -->
  <!-- Using SVG text with Google Fonts import trick via foreignObject is unreliable; 
       using path-based approach with system font fallback -->
  <text x="136" y="72"
        font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="52"
        letter-spacing="-1"
        fill="#1a1a1a">
    <tspan font-weight="300">mail</tspan><tspan font-weight="700">vault</tspan>
  </text>
</svg>
